
name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/project2-backend

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:latest ./backend

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:latest

  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Pull latest image
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/project2-backend:latest

      - name: Stop old container
        run: |
          docker stop expense-backend || true
          docker rm expense-backend || true

      - name: Run new container
        run: |
          docker run -d \
            --name expense-backend \
            -p 8000:8000 \
            ghcr.io/${{ github.repository_owner }}/project2-backend:latest
