name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.repository }}/project2:latest ./backend

      - name: Push Docker image
        run: docker push ghcr.io/${{ github.repository }}/project2:latest

  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Pull image
        run: docker pull ghcr.io/${{ github.repository }}/project2:latest
